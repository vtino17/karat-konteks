name: Bug report
description: Report a reproducible audit, runner, compiler, CLI, or Studio defect.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core audit
        - Workspace runner
        - Pack compiler
        - CLI
        - Studio
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include secrets or production context.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
